<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPP Video Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container vh-100 d-flex justify-content-center align-items-center">

        <div class="login-box row g-0">

            <div class="col-md-7 left-panel">

                <div class="logo">
                    <img src="{{ url_for('static',filename='images/upp.png') }}" alt="UPP Video" class="logo">
                </div>

                <h1>Welcome Back!</h1>

            </div>

            <div class="col-md-5 right-panel">

                <h2 class="mb-5">Log in</h2>

                <form action="/login" method="POST">

                    <div class="input-group mb-3">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" class="form-control" name="username" placeholder="Username">
                    </div>

                    <div class="input-group mb-2">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>

                        <input type="password" class="form-control" name="password" placeholder="Password">
                    </div>

                    <div class="d-flex justify-content-between small mb-4">
                        <div>
                            <input type="checkbox">
                            Remember Me
                        </div>

                        <a href="#" class="text-decoration-none">
                            Forgot Password?
                        </a>
                    </div>

                    <button class="btn btn-dark w-100 mb-3">
                        Log in
                    </button>

                    <div class="text-center mb-3">
                        Or
                    </div>

                    <button type="button" class="btn btn-light border w-100">
                        Sign up
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
