<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPP Video - Netflix Clone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body>

    <header class="barra-superior">
        <a href="/home">
            <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo-img" alt="UPP Video Logo">
        </a>

        {% if session.get('nombre') %}
        <div class="usuario-logueado">
            <i class="fa-solid fa-user-circle me-1"></i>
            {{ session['nombre'] }}
        </div>
        {% endif %}
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% if session.get('id_usuario') %}
    <footer class="footer-menu">
        <a href="/home" class="{% if request.path == '/home' %}active{% endif %}">
            <i class="fa-solid fa-house me-1"></i> Inicio
        </a>

        <a href="/peliculas_db" class="{% if request.path.startswith('/peliculas_db') %}active{% endif %}">
            <i class="fa-solid fa-film me-1"></i> Películas
        </a>

        <a href="/peliculas" class="{% if request.path.startswith('/peliculas') %}active{% endif %}">
            <i class="fa-solid fa-film me-1"></i> Categorías
        </a>

        <a href="/generos" class="{% if request.path.startswith('/generos') %}active{% endif %}">
            <i class="fa-solid fa-tags me-1"></i> Agregar Géneros
        </a>

        <a href="/planes" class="{% if request.path.startswith('/planes') %}active{% endif %}">
            <i class="fa-solid fa-credit-card me-1"></i> Planes
        </a>

        <a href="/usuarios" class="{% if request.path.startswith('/usuarios') %}active{% endif %}">
            <i class="fa-solid fa-users me-1"></i> Usuarios
        </a>

        <a href="{{ url_for('logout') }}">
            <i class="fa-solid fa-right-from-bracket me-1"></i> Salir
        </a>
    </footer>
    {% endif %}

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
